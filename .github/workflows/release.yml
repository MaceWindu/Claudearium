name: release

on:
  push:
    branches: [master]

permissions:
  contents: write

# Serialize so two merges in quick succession don't race on tag computation
# and emit duplicate vYYYY.M.N values.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Three scenarios:
      #   (a) HEAD is already tagged AND a GitHub Release exists for that tag
      #       -> nothing to do, skip the rest of the job.
      #   (b) HEAD is tagged but no release exists (e.g. a prior run pushed
      #       the tag and then failed before publishing) -> reuse the tag
      #       and recover by re-running the packaging + publish steps. Do
      #       NOT re-push the tag in this branch.
      #   (c) HEAD is untagged -> compute the next vYYYY.M.N for this UTC
      #       month and proceed normally.
      - name: Determine version (compute or recover)
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headTag = git tag --points-at HEAD |
              Where-Object { $_ -match '^v\d{4}\.\d+\.\d+$' } |
              Select-Object -First 1
          $skip = $false
          $reuseTag = $false
          $version = $null

          if ($headTag) {
              # `gh release view` exits non-zero on 404; suppress its noisy
              # 'release not found' to keep the log clean.
              gh release view $headTag --json tagName 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "HEAD already tagged $headTag and a release is published; nothing to do."
                  $skip = $true
              } else {
                  Write-Host "HEAD has tag $headTag but no release exists; recovering."
                  $version = $headTag.Substring(1)  # strip leading 'v'
                  $reuseTag = $true
              }
          } else {
              # Use UTC so the runner's timezone never shifts the YYYY.M
              # bucket. N resets implicitly each month (no v$y.$m.* tags exist
              # yet for the new bucket).
              $now = [DateTime]::UtcNow
              $y = $now.Year
              $m = [int]$now.Month
              $tags = git tag --list "v$y.$m.*"
              $maxN = 0
              foreach ($t in $tags) {
                  if ($t -match "^v$y\.$m\.(\d+)$") {
                      $n = [int]$Matches[1]
                      if ($n -gt $maxN) { $maxN = $n }
                  }
              }
              $version = "$y.$m.$($maxN + 1)"
              Write-Host "Computed version: $version"
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "skip=$($skip.ToString().ToLower())"
          if (-not $skip) {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "reuse_tag=$($reuseTag.ToString().ToLower())"
          }

      - name: Stage release tree and build zip
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $stage = Join-Path $env:RUNNER_TEMP "claudearium-stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null

          # Required root-level files. Missing any of these means a rename or
          # accidental deletion landed in master — fail loudly rather than
          # publish a release zip that's missing an entrypoint.
          $rootFiles = @(
              'claudearium.ps1',
              'open-claudearium.ps1',
              'test-claudearium.ps1',
              'README.md',
              'LICENSE'
          )
          foreach ($f in $rootFiles) {
              if (-not (Test-Path -LiteralPath $f -PathType Leaf)) {
                  throw "Required release file missing: $f"
              }
              Copy-Item -LiteralPath $f -Destination $stage
          }

          # Required directories shipped wholesale.
          foreach ($d in @('modules', 'payload', 'templates', 'docs')) {
              if (-not (Test-Path -LiteralPath $d -PathType Container)) {
                  throw "Required release directory missing: $d"
              }
              Copy-Item -LiteralPath $d -Destination $stage -Recurse
          }

          # tests/ — only diagnostic lane + runner deps. Pure/distro/manual
          # lanes are dev/CI concerns; shipping them would require Pester on
          # the user's machine and clutters the install with code they
          # shouldn't run.
          New-Item -ItemType Directory -Path (Join-Path $stage 'tests') | Out-Null
          foreach ($d in @('tests/diagnostic', 'tests/lib')) {
              if (-not (Test-Path -LiteralPath $d -PathType Container)) {
                  throw "Required release directory missing: $d"
              }
              Copy-Item -LiteralPath $d -Destination (Join-Path $stage 'tests') -Recurse
          }

          # VERSION file (UTF-8, no BOM, no trailing newline).
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $stage 'VERSION'), $version, $utf8)

          # manifest.txt — sorted relative paths, forward slashes, LF lines.
          # Lists every file in the zip (including VERSION and manifest.txt
          # itself) so the in-tool updater can compute OLD - NEW removals.
          $files = Get-ChildItem -Path $stage -Recurse -File | ForEach-Object {
              $_.FullName.Substring($stage.Length + 1) -replace '\\', '/'
          }
          $files = @($files) + 'manifest.txt' | Sort-Object -Unique
          $manifestContent = ($files -join "`n") + "`n"
          [System.IO.File]::WriteAllText((Join-Path $stage 'manifest.txt'), $manifestContent, $utf8)

          $zip = Join-Path $env:RUNNER_TEMP "claudearium-v$version.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Built $zip"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip=$zip"
        id: stage

      # Skipped in the recovery branch — the tag is already pushed.
      - name: Tag and push
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.reuse_tag != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "v$version"
          git push origin "v$version"

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zip = '${{ steps.stage.outputs.zip }}'
          # --generate-notes builds release notes from merged PR titles since
          # the previous tag. PR titles must be release-notes-friendly (see
          # CLAUDE.md "PR titles must be release-notes-friendly").
          gh release create "v$version" $zip --generate-notes --title "v$version"
