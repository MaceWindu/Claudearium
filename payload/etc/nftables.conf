#!/usr/sbin/nft -f

# Claudearium killswitch ruleset.
#
# Loaded at boot by nftables.service AFTER claudearium-killswitch.service has
# generated /etc/nftables.conf.d/00-host.nft with HOST_SUBNET / WG_PEER_IP
# / WG_PEER_PORT defines. The two policies together produce:
#
#   - Everything via wg0 is allowed (the VPN itself).
#   - Host-side services on the WSL2 NAT subnet (host.internal:* — e.g. Seq
#     on the user's Windows host) remain reachable.
#   - The WG handshake to the peer's IP:port is allowed on eth0 so the
#     tunnel can come up in the first place.
#   - Everything else off eth0 is dropped — no leak if wg0 goes down.

flush ruleset

include "/etc/nftables.conf.d/00-host.nft"

table inet claudearium {
    chain input {
        type filter hook input priority 0; policy drop;
        iifname "lo" accept
        ct state established,related accept
        iifname "eth0" ip saddr $HOST_SUBNET accept
        # iifname (string match) rather than iif (device-index lookup) so the
        # rule loads cleanly even when wg0 doesn't exist yet at boot.
        iifname "wg0" accept
    }

    chain output {
        type filter hook output priority 0; policy drop;
        oifname "lo" accept
        oifname "wg0" accept
        ct state established,related accept
        # Host services on the WSL2 NAT subnet (Seq, IIS, etc.) — the killswitch
        # exception that makes 'host.internal' work without leaking elsewhere.
        # Port 53 is *excluded* so DNS queries can't reach the Windows host
        # resolver (which would forward via the host's ISP DNS, leaking the
        # distro's name-lookups out-of-tunnel). The wg0.conf must set
        # 'DNS = <wg0-side resolver>' so wg-quick configures /etc/resolv.conf
        # to use it; Invoke-VpnEnable warns at apply time if it doesn't.
        oifname "eth0" ip daddr $HOST_SUBNET udp dport != 53 accept
        oifname "eth0" ip daddr $HOST_SUBNET tcp dport != 53 accept
        # WG handshake: a single UDP datagram to the peer endpoint to bring up
        # the tunnel. Once wg0 exists, everything else routes via wg0.
        oifname "eth0" ip daddr $WG_PEER_IP udp dport $WG_PEER_PORT accept
        # DHCP lease renewal on eth0.
        oifname "eth0" udp dport 67 accept
        # ICMP to gateway (ping host.internal for diagnostics).
        oifname "eth0" ip daddr $HOST_SUBNET icmp type echo-request accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }
}
